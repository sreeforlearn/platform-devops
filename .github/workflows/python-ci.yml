name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: "3.12"
      requirements-file:
        type: string
        required: false
        default: requirements.txt
      test-path:
        type: string
        required: false
        default: tests
      run-security-scans:
        type: boolean
        required: false
        default: true
      build-docker:
        type: boolean
        required: false
        default: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ inputs.requirements-file }}"
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -v "${{ inputs.test-path }}"