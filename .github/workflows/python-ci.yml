name: Reusable - Python CI

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      SNYK_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      JFROG_URL:
        required: true
      JFROG_USERNAME:
        required: true
      JFROG_ACCESS_TOKEN:
        required: true
      JFROG_REPO:
        required: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: releaselab-py

jobs:
  # 1. Python tests and coverage
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          mkdir -p reports
          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            reports/junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7
